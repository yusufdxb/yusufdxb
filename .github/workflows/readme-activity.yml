name: readme activity

# Regenerates the contribution sparkline and the one sentence of real numbers
# in the README from the GitHub contributions API, so nothing on the profile
# depends on a third-party stats service.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render dependencies
        run: python -m pip install --quiet "pillow>=10" "numpy>=1.26"

      - name: Render activity
        env:
          # README_TOKEN is optional. With only the default GITHUB_TOKEN the
          # API returns the public contribution view, which is what a visitor
          # sees anyway; the panel labels which view it drew.
          README_TOKEN: ${{ secrets.README_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/readme/render_activity.py

      - name: Commit if the figures changed
        run: |
          set -euo pipefail
          FILES="assets/readme/activity-light.png assets/readme/activity-dark.png assets/readme/activity.json README.md"
          if git diff --quiet -- $FILES; then
            echo "activity unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Refresh the activity figures from the contributions API"
          git push
